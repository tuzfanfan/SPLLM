<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f0e6"/>
      <stop offset="100%" stop-color="#efe6d7"/>
    </linearGradient>
    <linearGradient id="coverArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20393a"/>
      <stop offset="50%" stop-color="#47605b"/>
      <stop offset="100%" stop-color="#b87b4b"/>
    </linearGradient>
    <linearGradient id="seaArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30585e"/>
      <stop offset="100%" stop-color="#d7b08a"/>
    </linearGradient>
    <linearGradient id="mapArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2eadf"/>
      <stop offset="100%" stop-color="#d2c1ab"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <style>
      .title { font-family: "Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif; fill: #1b1a18; }
      .sans { font-family: "Microsoft YaHei","Noto Sans SC",sans-serif; fill: #2f2a24; }
      .muted { fill: #6d6258; }
      .small { font-size: 24px; }
      .body { font-size: 30px; }
      .section { font-size: 64px; font-weight: 700; letter-spacing: 2px; }
      .sub { font-size: 30px; letter-spacing: 4px; }
      .label { font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1600" height="2000" fill="url(#paper)"/>
  <rect width="1600" height="2000" filter="url(#grain)" opacity="0.55"/>
  <line x1="100" y1="150" x2="1500" y2="150" stroke="#8b6d52" stroke-width="2"/>
  <line x1="100" y1="1880" x2="1500" y2="1880" stroke="#8b6d52" stroke-width="2"/>
  <text x="120" y="105" class="sans label">CULTURAL BROCHURE SYSTEM / 可编辑设计稿</text>
  <text x="120" y="250" class="title section">《歌乐拾音》文化宣传册视觉样板</text>
  <text x="120" y="305" class="sans sub muted">基于“星海音乐学院音乐博物馆”栏目气质提炼</text>

  <g transform="translate(120 400)">
    <rect x="0" y="0" width="410" height="1240" rx="14" fill="#fbf7f0" stroke="#9e8a76" stroke-width="2"/>
    <rect x="28" y="28" width="354" height="500" rx="10" fill="url(#coverArt)"/>
    <path d="M55 444 C120 380, 180 410, 240 352 C280 314, 320 324, 360 280" fill="none" stroke="#f0dcc0" stroke-width="3" opacity="0.7"/>
    <path d="M70 468 C160 420, 250 465, 340 410" fill="none" stroke="#d6b085" stroke-width="2" opacity="0.8"/>
    <path d="M90 496 C150 430, 230 465, 318 398" fill="none" stroke="#0e2526" stroke-width="8" opacity="0.35"/>
    <circle cx="296" cy="140" r="52" fill="#ddb98d" opacity="0.9"/>
    <text x="48" y="612" class="title" style="font-size:56px;font-weight:700;">歌乐拾音</text>
    <text x="48" y="658" class="sans body muted">岭南民间歌乐文化图谱</text>
    <line x1="48" y1="706" x2="352" y2="706" stroke="#8b6d52" stroke-width="1.5"/>
    <text x="48" y="778" class="sans body">以馆藏线索串联地方乐种、</text>
    <text x="48" y="822" class="sans body">口头传统、仪式场景与地域记忆，</text>
    <text x="48" y="866" class="sans body">形成兼具学术传播与审美节奏的</text>
    <text x="48" y="910" class="sans body">系列文化读本。</text>
    <text x="48" y="1010" class="sans small muted">栏目单位</text>
    <text x="48" y="1052" class="title" style="font-size:30px;">星海音乐学院音乐博物馆</text>
    <text x="48" y="1134" class="sans small muted">版式要点</text>
    <text x="48" y="1172" class="sans small">米白纸底 / 文献纹理 / 黛绿与赭棕配色</text>
    <text x="48" y="1206" class="sans small">大标题留白 / 图文分层 / 题签感信息标签</text>
  </g>

  <g transform="translate(595 480)">
    <rect x="0" y="0" width="420" height="1090" rx="14" fill="#fbf7f0" stroke="#9e8a76" stroke-width="2"/>
    <text x="36" y="66" class="title" style="font-size:48px;font-weight:700;">汕尾渔歌</text>
    <text x="36" y="106" class="sans small muted">海上劳作、仪式与歌唱传统</text>
    <line x1="36" y1="132" x2="384" y2="132" stroke="#8b6d52" stroke-width="1.2"/>
    <rect x="36" y="168" width="170" height="350" rx="8" fill="url(#seaArt)"/>
    <path d="M56 420 C100 360, 126 380, 174 330" fill="none" stroke="#efe1ca" stroke-width="3"/>
    <path d="M76 450 C114 430, 150 444, 190 412" fill="none" stroke="#1c3133" stroke-width="7" opacity="0.25"/>
    <rect x="230" y="168" width="154" height="82" fill="#efe6d7"/>
    <rect x="230" y="264" width="154" height="82" fill="#f3ebde"/>
    <rect x="230" y="360" width="154" height="82" fill="#efe6d7"/>
    <rect x="230" y="456" width="154" height="62" fill="#f3ebde"/>
    <text x="246" y="200" class="title" style="font-size:24px;">历史源流</text>
    <text x="246" y="228" class="sans small">海岸社区口传歌唱与</text>
    <text x="246" y="254" class="sans small">渔事节律相互生成</text>
    <text x="246" y="296" class="title" style="font-size:24px;">表演场景</text>
    <text x="246" y="324" class="sans small">出海、收网、祭海、</text>
    <text x="246" y="350" class="sans small">节庆聚唱</text>
    <text x="246" y="392" class="title" style="font-size:24px;">音乐特点</text>
    <text x="246" y="420" class="sans small">长腔、呼应式节奏、</text>
    <text x="246" y="446" class="sans small">强烈海风感</text>
    <text x="246" y="486" class="title" style="font-size:24px;">文化意义</text>
    <text x="246" y="514" class="sans small">劳动经验与地域情感</text>
    <text x="36" y="584" class="sans body">“渔歌并不是孤立的曲调，而是海上生活</text>
    <text x="36" y="624" class="sans body">组织方式、身体节奏和群体记忆的复调。”</text>
    <rect x="36" y="674" width="348" height="2" fill="#8b6d52"/>
    <text x="36" y="732" class="title" style="font-size:28px;">阅读结构</text>
    <text x="36" y="776" class="sans small">1. 起源与地方环境</text>
    <text x="36" y="810" class="sans small">2. 场景中的歌唱功能</text>
    <text x="36" y="844" class="sans small">3. 旋律与腔调辨识</text>
    <text x="36" y="878" class="sans small">4. 当代传承与档案线索</text>
    <text x="36" y="950" class="sans small muted">注释 / 参考 / 馆藏编号</text>
    <text x="36" y="988" class="sans small">图1 渔歌采录示意　图2 海岸劳作节律</text>
    <text x="36" y="1022" class="sans small">馆藏线索：音博藏珍系列，岭南地方歌乐条目</text>
  </g>

  <g transform="translate(1080 560)">
    <rect x="0" y="0" width="400" height="980" rx="14" fill="#fbf7f0" stroke="#9e8a76" stroke-width="2"/>
    <text x="34" y="62" class="title" style="font-size:42px;font-weight:700;">岭南歌乐的地方谱系</text>
    <text x="34" y="100" class="sans small muted">文献、地图、谱例与栏目索引的策展型信息页</text>
    <line x1="34" y1="128" x2="364" y2="128" stroke="#8b6d52" stroke-width="1.2"/>
    <rect x="34" y="162" width="332" height="220" rx="8" fill="url(#mapArt)" stroke="#b59f86" stroke-width="1"/>
    <path d="M90 290 C130 220, 190 230, 212 176 C242 210, 286 230, 320 278 C282 340, 228 336, 158 342 C122 340, 98 328, 90 290 Z" fill="none" stroke="#876c58" stroke-width="2"/>
    <circle cx="124" cy="276" r="5" fill="#9e503e"/>
    <circle cx="196" cy="234" r="5" fill="#3f6057"/>
    <circle cx="254" cy="314" r="5" fill="#9e503e"/>
    <text x="136" y="280" class="sans small">客家山歌</text>
    <text x="210" y="238" class="sans small">潮州歌册</text>
    <text x="266" y="318" class="sans small">雷州民歌</text>
    <text x="34" y="438" class="title" style="font-size:26px;">栏目条目</text>
    <rect x="34" y="462" width="332" height="130" fill="#f4ecdf"/>
    <text x="50" y="498" class="sans small">汕尾渔歌　潮州歌册　雷州民歌</text>
    <text x="50" y="532" class="sans small">客家山歌　白口莲山歌　龙舟说唱</text>
    <text x="50" y="566" class="sans small muted">条目可按“地域 / 场景 / 文献形态 / 声音特征”归档</text>
    <text x="34" y="642" class="title" style="font-size:26px;">信息模块</text>
    <rect x="34" y="668" width="98" height="88" fill="#efe6d7"/>
    <rect x="150" y="668" width="98" height="88" fill="#efe6d7"/>
    <rect x="266" y="668" width="100" height="88" fill="#efe6d7"/>
    <text x="50" y="706" class="sans small">时间线</text>
    <text x="166" y="706" class="sans small">谱例片段</text>
    <text x="286" y="706" class="sans small">器物图版</text>
    <text x="50" y="734" class="sans small muted">形成</text>
    <text x="166" y="734" class="sans small muted">腔调</text>
    <text x="286" y="734" class="sans small muted">实物</text>
    <text x="34" y="824" class="title" style="font-size:26px;">统一视觉规范</text>
    <text x="34" y="866" class="sans small">纸色基底 / 深色细边 / 低饱和历史配色</text>
    <text x="34" y="898" class="sans small">信息图不做科技蓝，不做文旅海报感</text>
    <text x="34" y="930" class="sans small">强调“馆藏传播”而非“商业促销”</text>
  </g>

  <g transform="translate(120 1720)">
    <text x="0" y="0" class="title" style="font-size:30px;">交付文件</text>
    <text x="0" y="42" class="sans small">01 overview-board.svg　02 cover.svg　03 genre-feature.svg　04 lineage-atlas.svg</text>
  </g>
</svg>
