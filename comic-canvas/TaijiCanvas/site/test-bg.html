<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taiji Background Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    /* 原始项目的径向渐变背景层 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(1200px 800px at 50% 45%, rgba(80, 120, 200, 0.06), transparent 60%),
        radial-gradient(900px 700px at 72% 82%, rgba(200, 120, 60, 0.05), transparent 60%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
  <script type="module" src="./taiji-bg.js"></script>
</body>
</html>
