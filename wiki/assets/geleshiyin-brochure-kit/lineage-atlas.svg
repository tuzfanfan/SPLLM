  <line x1="130" y1="1344" x2="388" y2="1344" stroke="#8a6f59" stroke-width="1.5"/>
  <line x1="130" y1="1374" x2="388" y2="1374" stroke="#8a6f59" stroke-width="1.5"/>
  <line x1="130" y1="1404" x2="388" y2="1404" stroke="#8a6f59" stroke-width="1.5"/>
  <text x="486" y="1260" class="title" style="font-size:28px;">器物与图版</text>
  <text x="486" y="1304" class="sans" style="font-size:24px;">唱本、旧刊、乐器、采风照片</text>
  <rect x="486" y="1342" width="92" height="72" fill="#e2d2bf"/>
  <rect x="596" y="1342" width="92" height="72" fill="#d8c3ab"/>
  <rect x="706" y="1342" width="44" height="72" fill="#ceb69d"/>
  <text x="842" y="1260" class="title" style="font-size:28px;">索引说明</text>
  <text x="842" y="1304" class="sans" style="font-size:24px;">按地域、乐种、场景、文献载体</text>
  <text x="842" y="1342" class="sans" style="font-size:24px;">建立可检索目录</text>
  <text x="842" y="1400" class="sans muted" style="font-size:22px;">适合做成一整页的策展导览内容。</text>
  <text x="1044" y="1652" class="sans muted" style="font-size:22px;">03</text>
</svg>
