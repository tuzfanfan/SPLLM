  <rect x="784" y="648" width="352" height="232" fill="#efe6d8"/>
  <text x="816" y="700" class="title" style="font-size:30px;">关键词标签</text>
  <text x="816" y="748" class="sans" style="font-size:24px;">口传传统 / 劳作场景 / 仪式性 / 采录</text>
  <text x="816" y="786" class="sans" style="font-size:24px;">馆藏档案 / 腔调结构 / 地方记忆</text>
  <text x="816" y="838" class="sans muted" style="font-size:22px;">这里可替换成每期文章里沉淀出的主题词。</text>

