<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f2e8"/>
      <stop offset="100%" stop-color="#f0e6d7"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28525a"/>
      <stop offset="100%" stop-color="#d8b08a"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <style>
      .title { font-family: "Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif; fill: #1f1a16; }
      .sans { font-family: "Microsoft YaHei","Noto Sans SC",sans-serif; fill: #312922; }
      .muted { fill: #6f6358; }
    </style>
  </defs>

  <rect width="1240" height="1754" fill="url(#paper)"/>
  <rect width="1240" height="1754" filter="url(#grain)" opacity="0.5"/>
  <rect x="58" y="58" width="1124" height="1638" fill="none" stroke="#977c63" stroke-width="2"/>
  <text x="102" y="126" class="sans muted" style="font-size:20px;letter-spacing:3px;">专题内页 / 单一乐种介绍页</text>
  <text x="102" y="224" class="title" style="font-size:82px;font-weight:700;">汕尾渔歌</text>
  <text x="108" y="278" class="sans muted" style="font-size:28px;letter-spacing:3px;">海上劳作、仪式与歌唱传统</text>
  <line x1="102" y1="320" x2="1136" y2="320" stroke="#977c63" stroke-width="1.5"/>
  <rect x="102" y="378" width="476" height="680" rx="12" fill="url(#photo)"/>
  <path d="M138 950 C220 840, 310 878, 418 772" fill="none" stroke="#efe1c8" stroke-width="4"/>
  <path d="M148 1000 C254 938, 362 962, 520 878" fill="none" stroke="#1a3134" stroke-width="10" opacity="0.25"/>
  <path d="M184 908 C214 886, 252 858, 280 820 C292 884, 292 938, 302 996" fill="#183234" opacity="0.45"/>
  <path d="M334 868 C374 844, 418 814, 444 776 C458 834, 460 892, 470 964" fill="#173234" opacity="0.35"/>
  <text x="126" y="1110" class="sans muted" style="font-size:22px;">图版建议：海岸、舟船、劳动中的群体歌唱、地方采录旧照</text>

  <rect x="630" y="378" width="506" height="186" fill="#efe6d8"/>
  <text x="662" y="430" class="title" style="font-size:30px;">历史源流</text>
  <text x="662" y="476" class="sans" style="font-size:28px;">生成于海上劳作、出海收网与祭海仪式场景，</text>
  <text x="662" y="516" class="sans" style="font-size:28px;">长期以口传方式保存旋律与唱词。</text>

  <rect x="630" y="590" width="242" height="184" fill="#f4ecdf"/>
  <rect x="894" y="590" width="242" height="184" fill="#f4ecdf"/>
  <text x="658" y="642" class="title" style="font-size:28px;">表演场景</text>
  <text x="658" y="686" class="sans" style="font-size:24px;">海岸作业</text>
  <text x="658" y="720" class="sans" style="font-size:24px;">节庆聚唱</text>
  <text x="658" y="754" class="sans" style="font-size:24px;">仪式性呼应</text>
  <text x="922" y="642" class="title" style="font-size:28px;">音乐特点</text>
  <text x="922" y="686" class="sans" style="font-size:24px;">长腔拖音</text>
  <text x="922" y="720" class="sans" style="font-size:24px;">群体应答</text>
  <text x="922" y="754" class="sans" style="font-size:24px;">节律感强</text>

  <rect x="630" y="804" width="506" height="254" fill="#efe6d8"/>
  <text x="662" y="858" class="title" style="font-size:30px;">文化意义</text>
  <text x="662" y="906" class="sans" style="font-size:28px;">渔歌不仅是旋律样式，也是劳动节奏、</text>
  <text x="662" y="946" class="sans" style="font-size:28px;">地方认同与海洋记忆的声音组织方式。</text>
  <text x="662" y="1008" class="sans muted" style="font-size:24px;">可搭配引语框、采录时间、采录地点、采访对象信息。</text>

  <rect x="102" y="1184" width="1034" height="2" fill="#977c63"/>
  <text x="102" y="1260" class="title" style="font-size:34px;">阅读结构建议</text>
  <text x="102" y="1312" class="sans" style="font-size:28px;">01 起源与地域环境　02 场景中的歌唱功能　03 旋律与腔调辨识　04 当代传承线索</text>
  <text x="102" y="1400" class="title" style="font-size:30px;">引语框示意</text>
  <rect x="102" y="1438" width="1034" height="150" fill="#f5eee3"/>
  <text x="136" y="1504" class="sans" style="font-size:30px;">“声音不是附属材料，而是这类地方文化最核心的存在方式。”</text>
  <text x="136" y="1550" class="sans muted" style="font-size:22px;">注：此处可替换为文章中的关键原句、采录说明或策展引导语。</text>
  <text x="1044" y="1652" class="sans muted" style="font-size:22px;">02</text>
</svg>
