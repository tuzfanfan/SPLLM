<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f2e8"/>
      <stop offset="100%" stop-color="#efe5d7"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" stitchTiles="stitch"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <style>
      .title { font-family: "Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif; fill: #1f1a16; }
      .sans { font-family: "Microsoft YaHei","Noto Sans SC",sans-serif; fill: #312922; }
      .muted { fill: #6f6358; }
    </style>
  </defs>

  <rect width="1240" height="1754" fill="url(#paper)"/>
  <rect width="1240" height="1754" filter="url(#grain)" opacity="0.5"/>
  <rect x="58" y="58" width="1124" height="1638" fill="none" stroke="#977c63" stroke-width="2"/>
  <text x="102" y="126" class="sans muted" style="font-size:20px;letter-spacing:3px;">策展型信息页 / 文献与图版结合页</text>
  <text x="102" y="222" class="title" style="font-size:74px;font-weight:700;">岭南歌乐的地方谱系</text>
  <text x="106" y="276" class="sans muted" style="font-size:28px;letter-spacing:3px;">地图、条目、谱例、器物与时间线的知识图版</text>
