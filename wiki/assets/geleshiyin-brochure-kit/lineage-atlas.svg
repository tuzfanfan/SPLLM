  <rect x="102" y="380" width="640" height="500" fill="#f2eadf" stroke="#b29d84" stroke-width="1.5"/>
  <path d="M208 662 C236 540, 336 482, 422 452 C520 420, 596 484, 652 564 C620 718, 530 760, 386 784 C278 776, 230 740, 208 662 Z" fill="none" stroke="#866c58" stroke-width="3"/>
