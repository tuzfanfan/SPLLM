<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f0e5"/>
      <stop offset="100%" stop-color="#efe4d2"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3738"/>
      <stop offset="35%" stop-color="#47645f"/>
      <stop offset="100%" stop-color="#b07846"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
    <style>
      .title { font-family: "Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif; fill: #1e1a16; }
      .sans { font-family: "Microsoft YaHei","Noto Sans SC",sans-serif; fill: #302922; }
      .muted { fill: #6d6156; }
    </style>
  </defs>

  <rect width="1240" height="1754" fill="url(#paper)"/>
  <rect width="1240" height="1754" filter="url(#grain)" opacity="0.5"/>
  <rect x="58" y="58" width="1124" height="1638" fill="none" stroke="#93775d" stroke-width="2"/>
  <line x1="110" y1="144" x2="1130" y2="144" stroke="#93775d" stroke-width="1.5"/>
  <text x="112" y="114" class="sans" style="font-size:20px;letter-spacing:3px;">XINGHAI MUSEUM / LINGNAN MUSIC ARCHIVE</text>

  <rect x="112" y="214" width="1016" height="720" rx="14" fill="url(#hero)"/>
  <circle cx="905" cy="356" r="98" fill="#dcb487" opacity="0.92"/>
  <path d="M160 740 C270 635, 410 680, 525 572 C611 494, 701 506, 853 426" fill="none" stroke="#efd9bb" stroke-width="4" opacity="0.75"/>
  <path d="M174 790 C348 690, 536 732, 840 614" fill="none" stroke="#112526" stroke-width="10" opacity="0.28"/>
  <path d="M184 832 C300 810, 442 826, 620 770 C710 742, 810 706, 1020 646" fill="none" stroke="#d0a170" stroke-width="3" opacity="0.86"/>
  <path d="M240 642 C278 630, 332 592, 358 550 C382 596, 390 664, 404 736" fill="#15292a" opacity="0.55"/>
  <path d="M448 624 C484 600, 530 572, 566 528 C582 584, 582 642, 596 720" fill="#173030" opacity="0.45"/>
  <path d="M752 654 C788 630, 832 600, 872 544 C888 618, 888 680, 896 742" fill="#182f2f" opacity="0.4"/>

  <text x="112" y="1088" class="title" style="font-size:102px;font-weight:700;letter-spacing:4px;">歌乐拾音</text>
  <text x="120" y="1160" class="sans muted" style="font-size:34px;letter-spacing:6px;">岭南民间歌乐文化图谱</text>
  <line x1="112" y1="1208" x2="1128" y2="1208" stroke="#93775d" stroke-width="1.5"/>
  <text x="112" y="1302" class="sans" style="font-size:34px;">以地方乐种为线索，连接馆藏、口述传统、表演场景与地域记忆。</text>
  <text x="112" y="1350" class="sans" style="font-size:34px;">在“看得懂”的传播结构中，保存“听得到”的文化纹理。</text>
  <text x="112" y="1488" class="sans muted" style="font-size:24px;letter-spacing:3px;">出品单位</text>
  <text x="112" y="1530" class="title" style="font-size:34px;">星海音乐学院音乐博物馆</text>
  <text x="112" y="1610" class="sans muted" style="font-size:22px;">封面结构：主视觉 / 主题书名 / 副题 / 单位署名 / 底纹线索</text>
  <text x="1020" y="1610" class="sans muted" style="font-size:22px;">01</text>
</svg>
