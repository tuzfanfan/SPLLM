  <text x="594" y="652" class="sans" style="font-size:26px;">雷州民歌</text>
  <text x="400" y="718" class="sans" style="font-size:26px;">汕尾渔歌</text>
  <text x="126" y="420" class="title" style="font-size:30px;">地域分布示意</text>
  <text x="126" y="458" class="sans muted" style="font-size:22px;">可替换为具体行政区轮廓、采录点、馆藏来源地与传播路径。</text>

  <rect x="784" y="380" width="352" height="232" fill="#f5eee3"/>
  <text x="816" y="432" class="title" style="font-size:30px;">栏目条目</text>
  <text x="816" y="482" class="sans" style="font-size:26px;">潮州歌册</text>
  <text x="816" y="522" class="sans" style="font-size:26px;">客家山歌</text>
  <text x="816" y="562" class="sans" style="font-size:26px;">雷州民歌</text>
  <text x="950" y="482" class="sans" style="font-size:26px;">汕尾渔歌</text>
  <text x="950" y="522" class="sans" style="font-size:26px;">白口莲山歌</text>
